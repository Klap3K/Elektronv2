name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Zbuduj i opublikuj APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Przygotuj stały klucz podpisu wydania (umożliwia aktualizację bez odinstalowywania)
        run: |
          base64 -d .github/signing/release.pfx.b64 > release_raw.pfx
          openssl pkcs12 -in release_raw.pfx -passin pass:elektron123 -nodes -out release_bundle.pem
          openssl pkcs12 -export -in release_bundle.pem -out release.jks -name elektron -passout pass:elektron123
          rm -f release_raw.pfx release_bundle.pem

          cat <<EOF > keystore.properties
          storeFile=release.jks
          storePassword=elektron123
          keyAlias=elektron
          keyPassword=elektron123
          EOF

      - name: Kompilacja APK (Release i Debug)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleFossRelease :app:assembleFossDebug

      - name: Przygotuj pliki instalacyjne APK
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/foss/release/ -name "*.apk" -exec cp {} release-apk/Elektron-Vulcan.apk \;
          find app/build/outputs/apk/foss/debug/ -name "*.apk" -exec cp {} release-apk/Elektron-Vulcan-debug.apk \;
          ls -lh release-apk/

      - name: Opublikuj GitHub Release z plikami APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apk/Elektron-Vulcan.apk
            release-apk/Elektron-Vulcan-debug.apk
          name: "Elektron-Vulcan ${{ github.ref_name }}"
          body: |
            ### 🚀 Elektron-Vulcan ${{ github.ref_name }}
            
            Oficjalne wydanie instalacyjne aplikacji dla uczniów Zespołu Szkół Elektronicznych w Bydgoszczy.
            
            #### 📦 Pliki do pobrania i instalacji:
            - **[Elektron-Vulcan.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Elektron-Vulcan.apk)** — Podpisana stałym kluczem, zoptymalizowana wersja gotowa do bezpośredniej instalacji oraz aktualizacji w miejscu (Android 8.0+).
            - **[Elektron-Vulcan-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Elektron-Vulcan-debug.apk)** — Wersja debug z włączoną diagnostyką.
            
            #### 🌟 Kluczowe nowości w wersji ${{ github.ref_name }}:
            - ⏳ **Odliczanie do wydarzeń (Wakacje, ferie, 100-dniówka, matura):** Konfigurowalna karta na Stronie głównej odliczająca dni ogółem oraz dni nauki szkolnej (pon-pt), z opcją ustawienia własnej daty/tytułu lub wyboru szybkich szablonów.
            - 🔕 **Automatyczne wyciszanie na lekcjach (Auto DND):** Wycisza telefon podczas realnych lekcji i przywraca poprzedni profil dźwięku na przerwach, okienkach i po szkole; działa w tle dzięki precyzyjnemu harmonogramowi dzwonków (`AlarmManager`).
            - 🚀 **Automatyzacja sprawdzania wersji i aktualizacja 1 kliknięciem:** Sprawdzanie nowej wersji w tle przez `SyncWorker` oraz wbudowany instalator APK pobierający nową wersję z paskiem postępu i instalujący ją bez odinstalowywania aplikacji i bez otwierania przeglądarki.
            - 🎓 **Import ocen, sprawdzianów i frekwencji z eduVULCAN:** Poprawiona synchronizacja terminarza i ocen z dziennika.
          draft: false
          prerelease: false
