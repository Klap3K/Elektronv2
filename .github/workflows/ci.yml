name: Build i testy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "fastlane/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "fastlane/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [Github, Gms]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # The project targets JVM 17 independently of the build JDK.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # GMS is compiled and tested without production Firebase credentials.
      - name: Test, lint and build release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pelektron.gms=false :app:test${{ matrix.variant }}DebugUnitTest :app:assemble${{ matrix.variant }}Release :app:lint${{ matrix.variant }}Release
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"

      - name: Raport testów (przy błędzie)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raport-testow-${{ matrix.variant }}
          path: app/build/reports/tests/
          retention-days: 7
